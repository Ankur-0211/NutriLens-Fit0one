version: "3.8"

services:
  # 1. FastAPI Modular Monolith Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutrilens_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nutrilens_user:nutrilens_pass@postgres:5432/nutrilens_prod
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minio_admin
      - S3_SECRET_KEY=minio_secret_key_2026
      - S3_BUCKET=nutrilens-images
      - SECRET_KEY=nutrilens_production_secure_secret_key_change_in_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/backend/uploads

  # 2. Managed PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nutrilens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutrilens_user
      POSTGRES_PASSWORD: nutrilens_pass
      POSTGRES_DB: nutrilens_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrilens_user -d nutrilens_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis Cache & Quota Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: nutrilens_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. MinIO S3-Compatible Object Storage for Images
  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: nutrilens_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_key_2026
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
